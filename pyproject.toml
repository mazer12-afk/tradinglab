[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradinglab"
version = "0.1.0"
description = "Autonomous systematic trading lab: research, model selection and live paper trading on crypto markets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "requests>=2.31",
  "scipy>=1.11",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
dev = ["pytest>=8"]
fast = ["numba>=0.60"]
intraday = ["lightgbm>=4.0"]

[project.scripts]
tradinglab = "tradinglab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: needs outbound access to the Binance archive",
  "slow: long-running test",
]
