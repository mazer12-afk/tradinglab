# Forward paper test of the frozen funding-carry rules R2 and R3 (research/proof/carry_forward.py), daily.
# Records (status.json, R2_daily.csv, R3_daily.csv) are committed to the branch experiment/carry-forward.
name: carry-forward
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: carry-forward
  cancel-in-progress: false
jobs:
  day:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Records branch
        run: scripts/experiment_records.sh experiment/carry-forward
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Forward test
        run: python research/proof/carry_forward.py --records records
      - name: Commit records
        run: |
          cd records
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "carry forward: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git push -q origin HEAD:experiment/carry-forward && exit 0; sleep $((i * 5)); done
          exit 1
