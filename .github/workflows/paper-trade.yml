# Runs one live paper-trading cycle every hour on GitHub's runners (which can
# reach exchange APIs → realtime mode) and commits the updated state/ journal.
# Scheduled workflows only run from the default branch. Uses Actions minutes
# (free for public repos; metered for private ones), so it is opt-in: set the
# repository variable PAPER_TRADING_ENABLED=true to activate it.
name: paper-trade
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency:
  group: paper-trade
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  cycle:
    if: ${{ vars.PAPER_TRADING_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - run: pip install -e .
      - run: tradinglab probe
      - run: tradinglab cycle --report
      - name: Commit state
        run: |
          git config user.name "tradinglab-bot"
          git config user.email "tradinglab-bot@users.noreply.github.com"
          git add state reports/live.html
          git diff --cached --quiet || git commit -m "paper-trade: cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
