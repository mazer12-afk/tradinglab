# Forward paper test of the frozen day-trading candidate (config/daytrade2_candidate.json,
# src/tradinglab/daytrade/forward.py). Binance's futures API is geo-blocked from GitHub's runners, so
# the test trades the public archive: once a day it trades every UTC day whose 1-minute bars and futures
# metrics have been published (and the next day too, for exits). Nothing is re-tuned.
# Records (events, trades, models, equity, status) live on the branch experiment/daytrade-forward.
# The first run builds the history seed from the archive (about 20 minutes).
name: daytrade-forward
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
concurrency:
  group: daytrade-forward
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Gate (public repository)
        id: gate
        run: |
          private=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | jq -r .private)
          if [ "$private" = "true" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Repository is private – skipping the scheduled run."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - name: Records branch
        if: steps.gate.outputs.go == 'true'
        run: scripts/experiment_records.sh experiment/daytrade-forward
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            deploy/experiment-constraints.txt
      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: pip install -c deploy/experiment-constraints.txt -e ".[intraday,fast]"
      - name: Trade the newly published days
        if: steps.gate.outputs.go == 'true'
        run: python -m tradinglab.cli daytrade-forward --records records
      - name: Commit records
        if: steps.gate.outputs.go == 'true'
        run: |
          cd records
          git add -A
          git commit -q -m "forward test through $(jq -r .through status.json): frozen $(jq -r .arms.frozen.trades status.json) trades, return $(jq -r .arms.frozen.total_return status.json)" || echo "nothing new"
          git push -q origin HEAD:experiment/daytrade-forward
