# One-off: which market-data endpoints can GitHub-hosted runners reach?
name: probe
on:
  push:
    branches: [claude/autonomous-trading-lab-w704x2]
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Endpoints
        run: |
          probe() { code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 15 "$1"); echo "$code $1 :: $(head -c 160 /tmp/out | tr '\n' ' ')"; }
          probe "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=5m&limit=2"
          probe 'https://data-api.binance.vision/api/v3/ticker/bookTicker?symbols=%5B%22BTCUSDT%22,%22ETHUSDT%22%5D'
          probe "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=5m&limit=1"
          probe "https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT"
          probe "https://api.binance.us/api/v3/klines?symbol=BTCUSDT&interval=5m&limit=1"
          probe "https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP"
          probe "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=300"
          probe "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=5"
          probe "https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT"
          probe "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision?prefix=data/spot/daily/klines/BTCUSDT/5m/&max-keys=2"
          probe "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-2024-01.zip"
          curl -s --max-time 10 https://ipinfo.io/json | head -c 300; echo
          nproc; free -g | head -2; df -h / | tail -1
