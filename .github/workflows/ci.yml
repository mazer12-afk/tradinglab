name: ci
on:
  push:
    paths: ["src/**", "tests/**", "config/**", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "config/**", "pyproject.toml", ".github/workflows/ci.yml"]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - run: pip install -e ".[dev]"
      - run: pytest -q
